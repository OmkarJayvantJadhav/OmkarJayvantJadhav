 dur="0.9s" begin="0.56s" fill="freeze"/><animate attributeName="y" from="238" to="110" dur="0.9s" begin="0.56s" fill="freeze"/></rect><rect x="1048" y="126" width="22" height="112" rx="4" fill="url(#bar)" opacity="0.9"><animate attributeName="height" from="0" to="112" dur="0.9s" begin="0.64s" fill="freeze"/><animate attributeName="y" from="238" to="126" dur="0.9s" begin="0.64s" fill="freeze"/></rect><rect x="1084" y="88" width="22" height="150" rx="4" fill="url(#bar)" opacity="0.9"><animate attributeName="height" from="0" to="150" dur="0.9s" begin="0.72s" fill="freeze"/><animate attributeName="y" from="238" to="88" dur="0.9s" begin="0.72s" fill="freeze"/></rect>
